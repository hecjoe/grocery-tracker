<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grocery Run</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grocery Run">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/shopping-cart.png">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --input-bg: #2c2c2e;
      --text-color: #ffffff;
      --text-secondary: #8e8e93;
      --accent-blue: #0a84ff;
      --accent-red: #ff453a;
      --accent-green: #30d158;
      --border-color: #38383a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background-color: var(--bg-color);
      padding-top: calc(env(safe-area-inset-top) + 12px);
    }

    .title-input {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.8rem;
      font-weight: bold;
      width: 60%;
      outline: none;
    }

    .btn-edit {
      background: #2c2c2e;
      color: var(--accent-blue);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-trash {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: var(--accent-red);
      margin-left: 10px;
      cursor: pointer;
    }

    /* BUDGET DASHBOARD */
    .budget-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 12px 16px;
      background-color: #121214;
    }

    .budget-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .budget-card input {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.85rem;
      width: 100%;
    }

    .budget-name {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .budget-amount {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .amount-green { color: var(--accent-green); }
    .amount-red { color: var(--accent-red); }

    .btn-add-profile {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      color: var(--accent-blue);
      border-radius: 12px;
      min-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* ITEM LIST */
    .item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .item-buyer {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border-radius: 6px;
      overflow: hidden;
    }

    .stepper button {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      padding: 4px 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .stepper span {
      font-size: 0.85rem;
      padding: 0 4px;
    }

    .btn-delete-item {
      color: var(--accent-red);
      background: transparent;
      border: none;
      font-size: 1.1rem;
      margin-left: 8px;
      cursor: pointer;
    }

    /* FOOTER */
    .footer {
      padding: 12px 16px;
      padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .input-name { flex: 1; }
    .input-price { width: 175px; }

    .segmented-picker {
      display: flex;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 2px;
      overflow-x: auto;
    }

    .picker-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 20px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .picker-btn.active {
      background: #636366;
      font-weight: 600;
    }

    .btn-add-item {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-add-item:disabled {
      opacity: 0.5;
    }

    .btn-scan {
      background: var(--input-bg);
      color: var(--accent-blue);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-scan:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .scan-status {
      min-height: 1rem;
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .spinner {
      display: inline-block;
      width: 0.8rem;
      height: 0.8rem;
      margin-right: 0.35rem;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -0.08rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <input type="text" id="tripName" class="title-input" value="Grocery Run" onchange="saveData()">
    <div>
      <button class="btn-edit" id="editBudgetsBtn" onclick="toggleEditBudgets()">Edit Budgets</button>
      <button class="btn-trash" onclick="clearAllItems()">🗑️</button>
    </div>
  </div>

  <!-- BUDGET DASHBOARD -->
  <div class="budget-scroll" id="budgetDashboard"></div>

  <!-- ITEM LIST -->
  <div class="item-list" id="itemList"></div>

  <!-- STICKY FOOTER -->
  <div class="footer">
    <div class="input-group">
      <input type="text" id="newItemName" class="input-name" placeholder="Item Name" oninput="validateInput()" onkeydown="handleItemNameKeydown(event)">
      <input type="number" step="0.01" id="newItemPrice" class="input-price" placeholder="Price" oninput="validateInput()" onkeydown="handleItemPriceKeydown(event)">
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden onchange="processScan(event)">
    
    <div class="input-group">
      <div class="segmented-picker" id="shopperPicker"></div>
      <button class="btn-scan" id="scanButton" type="button" onclick="document.getElementById('cameraInput').click()" aria-label="Scan a price tag" title="Scan a price tag">📷</button>
      <button class="btn-add-item" id="addItemBtn" disabled onclick="addItem()">Add</button>
    </div>
    <p class="scan-status" id="scanStatus" aria-live="polite"></p>
  </div>

  <script>
    // STATE MANAGEMENT
    let state = {
      tripName: "Grocery Run",
      isEditingBudgets: false,
      selectedProfileId: null,
      profiles: [
        { id: '1', name: "Me", budget: 300 }
      ],
      items: []
    };

    // LOCAL STORAGE HANDLING
    function loadData() {
      const saved = localStorage.getItem('costco_tracker_data');
      if (saved) {
        state = JSON.parse(saved);
        state.isEditingBudgets = false;
      }
      if (state.profiles.length > 0 && !state.selectedProfileId) {
        state.selectedProfileId = state.profiles[0].id;
      }
      render();
    }

    function saveData() {
      state.tripName = document.getElementById('tripName').value;
      localStorage.setItem('costco_tracker_data', JSON.stringify(state));
      render();
    }

    // CALCULATIONS
    function totalSpent(profileId) {
      return state.items
        .filter(item => item.profileId === profileId)
        .reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
    }

    // RENDER FUNCTIONS
    function render() {
      document.getElementById('tripName').value = state.tripName;
      document.getElementById('editBudgetsBtn').innerText = state.isEditingBudgets ? "Done" : "Edit Budgets";

      // Render Dashboard
      const dashboard = document.getElementById('budgetDashboard');
      dashboard.innerHTML = '';

      state.profiles.forEach(profile => {
        const spent = totalSpent(profile.id);
        const remaining = profile.budget - spent;

        const card = document.createElement('div');
        card.className = 'budget-card';
        card.dataset.profileId = profile.id;

        if (state.isEditingBudgets) {
          card.innerHTML = `
            <input type="text" value="${profile.name}" placeholder="Budget name" onchange="updateProfile('${profile.id}', 'name', this.value)" onkeydown="handleBudgetNameKeydown(event, '${profile.id}')">
            <input type="number" value="${profile.budget}" placeholder="$0" min="0" step="0.01" onchange="updateProfile('${profile.id}', 'budget', this.value === '' ? '' : parseFloat(this.value) || 0)" onkeydown="handleBudgetAmountKeydown(event, '${profile.id}')">
            <button onclick="deleteProfile('${profile.id}')" style="color:var(--accent-red); background:none; border:none; text-align:left; font-size:0.75rem; cursor:pointer;">Delete</button>
          `;
        } else {
          card.innerHTML = `
            <span class="budget-name">${profile.name}</span>
            <span class="budget-amount ${remaining >= 0 ? 'amount-green' : 'amount-red'}">$${remaining.toFixed(2)}</span>
          `;
        }
        dashboard.appendChild(card);
      });

      if (state.isEditingBudgets) {
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add-profile';
        addBtn.innerHTML = `<span>+</span><span style="font-size:0.75rem">Add</span>`;
        addBtn.onclick = addProfile;
        dashboard.appendChild(addBtn);
      }

      // Render Item List
      const list = document.getElementById('itemList');
      list.innerHTML = '';

      state.items.forEach(item => {
        const profile = state.profiles.find(p => p.id === item.profileId);
        const total = item.unitPrice * item.quantity;

        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-details">
            <span class="item-name">${item.name}</span>
            <span class="item-buyer">${profile ? profile.name : 'Unknown'}</span>
          </div>
          <div class="item-controls">
            <div class="stepper">
              <button onclick="updateQuantity('${item.id}', -1)">-</button>
              <span>${item.quantity}</span>
              <button onclick="updateQuantity('${item.id}', 1)">+</button>
            </div>
            <span style="font-size:0.85rem; color:var(--text-secondary)">x $${item.unitPrice.toFixed(2)}</span>
            <span style="font-weight:bold; min-width:60px; text-align:right">$${total.toFixed(2)}</span>
            <button class="btn-delete-item" onclick="deleteItem('${item.id}')">✕</button>
          </div>
        `;
        list.appendChild(row);
      });

      // Render Shopper Picker
      const picker = document.getElementById('shopperPicker');
      picker.innerHTML = '';

      state.profiles.forEach(profile => {
        const btn = document.createElement('button');
        btn.className = `picker-btn ${state.selectedProfileId === profile.id ? 'active' : ''}`;
        btn.innerText = profile.name;
        btn.onclick = () => {
          state.selectedProfileId = profile.id;
          render();
        };
        picker.appendChild(btn);
      });

      validateInput();
    }

    // USER ACTIONS
    function toggleEditBudgets() {
      state.isEditingBudgets = !state.isEditingBudgets;
      render();
    }

    function addProfile() {
      const id = Date.now().toString();
      state.profiles.push({ id, name: "", budget: "" });
      if (!state.selectedProfileId) state.selectedProfileId = id;
      saveData();
      document.querySelector(`[data-profile-id="${id}"] input[type="text"]`)?.focus();
    }

    function updateProfile(id, key, value) {
      const profile = state.profiles.find(p => p.id === id);
      if (profile) {
        profile[key] = value;
        saveData();
      }
    }

    function handleBudgetNameKeydown(event, id) {
      if (event.key !== 'Enter') return;

      event.preventDefault();
      updateProfile(id, 'name', event.currentTarget.value);
      document.querySelector(`[data-profile-id="${id}"] input[type="number"]`)?.focus();
    }

    function handleBudgetAmountKeydown(event, id) {
      if (event.key !== 'Enter') return;

      event.preventDefault();
      const profile = state.profiles.find(p => p.id === id);
      if (profile) {
        profile.budget = event.currentTarget.value === '' ? '' : parseFloat(event.currentTarget.value) || 0;
      }
      state.isEditingBudgets = false;
      saveData();
    }

    function deleteProfile(id) {
      state.profiles = state.profiles.filter(p => p.id !== id);
      if (state.selectedProfileId === id) {
        state.selectedProfileId = state.profiles[0]?.id || null;
      }
      saveData();
    }

    function addItem() {
      const nameInput = document.getElementById('newItemName');
      const priceInput = document.getElementById('newItemPrice');

      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (name && !isNaN(price) && state.selectedProfileId) {
        state.items.push({
          id: Date.now().toString(),
          name,
          unitPrice: price,
          quantity: 1,
          profileId: state.selectedProfileId
        });

        nameInput.value = '';
        priceInput.value = '';
        saveData();
      }
    }

    function handleItemNameKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('newItemPrice').focus();
      }
    }

    function handleItemPriceKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        addItem();
      }
    }

    async function processScan(event) {
      const image = event.target.files?.[0];
      if (!image) return;

      const scanButton = document.getElementById('scanButton');
      const scanStatus = document.getElementById('scanStatus');
      const nameInput = document.getElementById('newItemName');
      const priceInput = document.getElementById('newItemPrice');

      scanButton.disabled = true;
      scanButton.innerHTML = '<span class="spinner" aria-hidden="true"></span>Scanning';
      scanStatus.textContent = 'Reading price tag…';

      try {
        const bitmap = await createImageBitmap(image);
        const canvas = (width, height) => {
          const result = document.createElement('canvas');
          result.width = width;
          result.height = height;
          return result;
        };
        const original = canvas(bitmap.width, bitmap.height);
        original.getContext('2d').drawImage(bitmap, 0, 0);
        bitmap.close();
        const worker = await Tesseract.createWorker('eng');
        let itemName = '', sellPrice = '';
        try {
          const read = async (input, mode = '6', digits = false) => {
            await worker.setParameters({
              tessedit_pageseg_mode: mode,
              tessedit_char_whitelist: digits ? '0123456789.' : '',
              user_defined_dpi: '300'
            });
            return (await worker.recognize(input.toDataURL('image/png'))).data;
          };
          const raw = await read(original, '11');
          const block = await read(original);
          const anchor = [...raw.words, ...block.words]
            .filter(word => /^\d{4,7}$/.test(word.text.trim()) && word.confidence > 45)
            .sort((a, b) => b.confidence - a.confidence)[0];

          // Locate the pale paper, removing narrow bridges to shelves/packaging.
          const width = 500, scale = width / original.width;
          const height = Math.round(original.height * scale);
          const preview = canvas(width, height);
          preview.getContext('2d').drawImage(original, 0, 0, width, height);
          const rgba = preview.getContext('2d').getImageData(0, 0, width, height).data;
          const components = (mask, w, h) => {
            const seen = new Uint8Array(w * h), result = [];
            for (let i = 0; i < mask.length; i++) {
              if (seen[i] || !mask[i]) continue;
              const pixels = [i];
              seen[i] = 1;
              let x0 = i % w, x1 = x0, y0 = Math.floor(i / w), y1 = y0;
              for (let k = 0; k < pixels.length; k++) {
                const at = pixels[k], x = at % w, y = Math.floor(at / w);
                x0 = Math.min(x0, x); x1 = Math.max(x1, x);
                y0 = Math.min(y0, y); y1 = Math.max(y1, y);
                for (const next of [x > 0 ? at - 1 : -1, x < w - 1 ? at + 1 : -1, at - w, at + w]) {
                  if (next >= 0 && next < mask.length && !seen[next] && mask[next]) {
                    seen[next] = 1;
                    pixels.push(next);
                  }
                }
              }
              result.push({ pixels, x0, x1, y0, y1, height: y1 - y0 + 1 });
            }
            return result;
          };
          const paper = (minimum, left = 0) => {
            const mask = new Uint8Array(width * height), eroded = new Uint8Array(mask.length);
            for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
              const i = (y * width + x) * 4;
              const low = Math.min(rgba[i], rgba[i + 1], rgba[i + 2]);
              const high = Math.max(rgba[i], rgba[i + 1], rgba[i + 2]);
              mask[y * width + x] = x >= left && low >= minimum && high - low <= 55 ? 1 : 0;
            }
            for (let y = 3; y < height - 3; y++) for (let x = 3; x < width - 3; x++) {
              let solid = 1;
              for (let dy = -3; dy <= 3 && solid; dy++) for (let dx = -3; dx <= 3; dx++) {
                if (!mask[(y + dy) * width + x + dx]) { solid = 0; break; }
              }
              eroded[y * width + x] = solid;
            }
            const region = components(eroded, width, height).sort((a, b) => b.pixels.length - a.pixels.length)[0];
            if (!region || region.pixels.length < width * height * 0.04) return null;
            const corners = [], extrema = [Infinity, -Infinity, -Infinity, Infinity];
            for (const i of region.pixels) {
              const x = i % width, y = Math.floor(i / width), values = [x + y, x - y, x + y, x - y];
              for (let k = 0; k < 4; k++) {
                if (k === 0 || k === 3 ? values[k] < extrema[k] : values[k] > extrema[k]) {
                  extrema[k] = values[k]; corners[k] = [x, y];
                }
              }
            }
            return corners;
          };
          let corners = paper(95);
          if (corners?.some(([x, y]) => x <= 3 || y <= 3 || x >= width - 4 || y >= height - 4)) {
            const left = anchor ? Math.max(0, (anchor.bbox.x0 - 1.5 * (anchor.bbox.y1 - anchor.bbox.y0)) * scale) : 0;
            corners = paper(130, left) || corners;
          }
          let tag = original;
          if (corners) {
            const [tl, tr, br, bl] = corners;
            const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
            const w = 1600, h = Math.round(w * (distance(tl, bl) + distance(tr, br)) / (distance(tl, tr) + distance(bl, br)));
            if (h > 200 && h < 2400) {
              tag = canvas(w, h);
              const ctx = tag.getContext('2d'), target = ctx.createImageData(w, h);
              const source = original.getContext('2d').getImageData(0, 0, original.width, original.height).data;
              // Resample the detected quadrilateral to align the printed rows.
              for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const u = x / (w - 1), v = y / (h - 1);
                const sx = Math.min(original.width - 1, Math.max(0, Math.round(((1 - v) * ((1 - u) * tl[0] + u * tr[0]) + v * ((1 - u) * bl[0] + u * br[0])) / scale)));
                const sy = Math.min(original.height - 1, Math.max(0, Math.round(((1 - v) * ((1 - u) * tl[1] + u * tr[1]) + v * ((1 - u) * bl[1] + u * br[1])) / scale)));
                const from = (sy * original.width + sx) * 4, to = (y * w + x) * 4;
                for (let c = 0; c < 3; c++) target.data[to + c] = source[from + c];
                target.data[to + 3] = 255;
              }
              ctx.putImageData(target, 0, 0);
            }
          }
          const crop = (input, x, y, w, h, outputWidth) => {
            const result = canvas(outputWidth, Math.max(1, Math.round(outputWidth * h / w)));
            result.getContext('2d').drawImage(input, x, y, w, h, 0, 0, result.width, result.height);
            return result;
          };

          // Compare full-tag and focused-name OCR, retaining the clearest reading per row.
          const full = await read(tag);
          const focusedTop = Math.round(tag.height * 0.16);
          const focused = await read(crop(tag, 0, focusedTop, tag.width, Math.round(tag.height * 0.34), 1200));
          const ignore = /\b(?:PRICE|SELL|INSTANT|SAVINGS|REBATE|EXP|LIMIT)\b/i;
          const cleanName = value => value.replace(/(?:^|\s)[|~:!%]+(?=\s|$)/g, ' ')
            .replace(/\b0Z\b/g, 'OZ').replace(/\s+/g, ' ').trim();
          const rows = [];
          for (const line of full.lines || []) {
            const words = line.words.filter(word => /[A-Z0-9]/.test(word.text) &&
              !/[a-z]/.test(word.text) && (word.bbox.y1 - word.bbox.y0) >= tag.width * 0.022);
            if (!words.length || words.some(word => /^\d{4,}$/.test(word.text.trim()))) continue;
            const y = Math.min(...words.map(word => word.bbox.y0));
            const text = words.map(word => word.text.trim()).join(' ');
            if (!/[A-Z]{2}/.test(text) || ignore.test(text) || y < tag.height * 0.12 || y > tag.height * 0.46) continue;
            rows.push({ y, words, text });
          }
          rows.sort((a, b) => a.y - b.y);
          const selectedRows = rows.slice(0, 3), names = [];
          for (let i = 0; i < selectedRows.length; i++) {
            const row = selectedRows[i];
            const heights = row.words.map(word => word.bbox.y1 - word.bbox.y0).sort((a, b) => a - b);
            const next = selectedRows[i + 1], previous = selectedRows[i - 1];
            const spacing = next ? next.y - row.y : previous ? row.y - previous.y : heights[0] * 1.4;
            let y = row.y;
            // A clipped item number can enlarge the first name word's box.
            if (i === 0 && selectedRows.length === 3) {
              const gap = selectedRows[2].y - selectedRows[1].y;
              if (Math.abs(spacing - gap) > gap * 0.2) y = selectedRows[1].y - gap;
            }
            const fontHeight = Math.min(heights[0], spacing * 0.8);
            const top = Math.max(0, Math.round(y - 4));
            const input = crop(tag, tag.width * 0.02, top, tag.width * 0.94, Math.round(fontHeight + 10), 1200);
            const data = await read(input, '7');
            const candidates = [];
            for (const [result, factor, ox, oy] of [
              [full, 1, 0, 0],
              [focused, tag.width / 1200, 0, focusedTop],
              [data, tag.width * 0.94 / 1200, tag.width * 0.02, top]
            ]) {
              for (const word of result.words) {
                const value = word.text.trim(), box = word.bbox;
                const x0 = box.x0 * factor + ox, x1 = box.x1 * factor + ox;
                const y0 = box.y0 * factor + oy, wh = (box.y1 - box.y0) * factor;
                if (word.confidence < 40 || !/[A-Z0-9&/]/.test(value) || /[a-z]/.test(value) ||
                    /^\d{4,}$/.test(value) || wh < fontHeight * 0.55 ||
                    Math.abs(y0 - y) > fontHeight * 0.65) continue;
                candidates.push({ text: value, x0, x1, confidence: word.confidence });
              }
            }
            // Keep a confidently read compound word instead of a slightly more
            // confident fragment occupying only part of the same printed word.
            for (const word of candidates) {
              word.score = word.confidence + (word.confidence >= 85 && candidates.some(other =>
                other.text.length < word.text.length && word.text.includes(other.text) &&
                other.confidence <= word.confidence + 5 &&
                Math.min(word.x1, other.x1) - Math.max(word.x0, other.x0) > (other.x1 - other.x0) * 0.8
              ) ? 5 : 0);
            }
            candidates.sort((a, b) => b.score - a.score);
            const chosen = [];
            for (const word of candidates) {
              if (chosen.some(other => Math.min(word.x1, other.x1) - Math.max(word.x0, other.x0) >
                  Math.min(word.x1 - word.x0, other.x1 - other.x0) * 0.3)) continue;
              chosen.push(word);
            }
            let text = cleanName(chosen.sort((a, b) => a.x0 - b.x0).map(word => word.text).join(' '));
            if (!/[A-Z]{2}/.test(text) || ignore.test(text)) text = cleanName(row.text);
            text = text.replace(/[!:~]+$/g, '').trim();
            if ((text.match(/"/g) || []).length === 1 && !/\d"/.test(text)) text = text.replace(/"/g, '');
            names.push(text);
          }
          itemName = names.join(' ');

          // Find the tallest connected printed digits in the lower half of the tag.
          // Read their entire band as one number so separated cents stay attached.
          const small = crop(tag, 0, 0, tag.width, tag.height, 800);
          const w = small.width, h = small.height;
          const pixels = small.getContext('2d').getImageData(0, 0, w, h).data;
          const gray = new Uint8Array(w * h);
          for (let i = 0; i < gray.length; i++) gray[i] = Math.round(0.299 * pixels[i * 4] + 0.587 * pixels[i * 4 + 1] + 0.114 * pixels[i * 4 + 2]);
          const prices = [];
          for (const threshold of [100, 140]) {
            const mask = new Uint8Array(w * h);
            for (let y = Math.ceil(h * 0.45); y < h * 0.98; y++) for (let x = Math.ceil(w * 0.05); x < w * 0.98; x++) {
              mask[y * w + x] = gray[y * w + x] <= threshold ? 1 : 0;
            }
            const glyphs = components(mask, w, h).filter(b => b.height > h * 0.04 && b.height < h * 0.5 && b.x1 - b.x0 < w * 0.45 && b.pixels.length > 30)
              .sort((a, b) => b.height - a.height);
            const largest = glyphs[0];
            if (!largest) continue;
            const group = glyphs.filter(b => b.height >= largest.height * 0.55 && Math.abs((b.y0 + b.y1) - (largest.y0 + largest.y1)) < largest.height * 0.8);
            const x0 = Math.max(0, Math.min(...group.map(b => b.x0)) - 8), y0 = Math.max(0, Math.min(...group.map(b => b.y0)) - 8);
            const bw = Math.min(w - x0, Math.max(...group.map(b => b.x1)) - x0 + 9), bh = Math.min(h - y0, Math.max(...group.map(b => b.y1)) - y0 + 9);
            const binary = canvas(bw + 40, bh + 40), ctx = binary.getContext('2d');
            ctx.fillStyle = 'white'; ctx.fillRect(0, 0, binary.width, binary.height);
            const ink = ctx.createImageData(bw, bh);
            for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
              const at = (y * bw + x) * 4, value = gray[(y + y0) * w + x + x0] <= threshold ? 0 : 255;
              ink.data[at] = ink.data[at + 1] = ink.data[at + 2] = value; ink.data[at + 3] = 255;
            }
            ctx.putImageData(ink, 20, 20);
            const data = await read(crop(binary, 0, 0, binary.width, binary.height, 600), '8', true);
            for (const word of data.words) {
              const value = word.text.trim();
              if (/^\d{1,4}\.\d{2}$/.test(value)) prices.push({ value, height: largest.height, confidence: word.confidence });
            }
          }
          prices.sort((a, b) => b.height - a.height || b.confidence - a.confidence);
          sellPrice = prices[0]?.value || '';
        } finally {
          await worker.terminate();
        }
        const priceMatch = sellPrice;
        if (itemName) nameInput.value = itemName;
        if (sellPrice) priceInput.value = sellPrice;

        scanStatus.textContent = priceMatch
          ? 'Price tag scanned. Review the details, then add the item.'
          : 'Text scanned. Add or correct the price before adding the item.';
        validateInput();
      } catch (error) {
        console.error('Price tag scan failed:', error);
        scanStatus.textContent = 'Could not read that photo. Please try another image.';
      } finally {
        scanButton.disabled = false;
        scanButton.textContent = '📷';
        event.target.value = '';
      }
    }

    function updateQuantity(id, delta) {
      const item = state.items.find(i => i.id === id);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          deleteItem(id);
        } else {
          saveData();
        }
      }
    }

    function deleteItem(id) {
      state.items = state.items.filter(i => i.id !== id);
      saveData();
    }

    function clearAllItems() {
      if (confirm("Clear all items from this trip?")) {
        state.items = [];
        saveData();
      }
    }

    function validateInput() {
      const name = document.getElementById('newItemName').value.trim();
      const price = document.getElementById('newItemPrice').value.trim();
      document.getElementById('addItemBtn').disabled = !(name && price && state.selectedProfileId);
    }

    // INITIALIZATION & SERVICE WORKER (OFFLINE SUPPORT)
    loadData();

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('pwa-v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
  </script>
</body>
</html>
