<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grocery Run</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grocery Run">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/shopping-cart.png">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --input-bg: #2c2c2e;
      --text-color: #ffffff;
      --text-secondary: #8e8e93;
      --accent-blue: #0a84ff;
      --accent-red: #ff453a;
      --accent-green: #30d158;
      --border-color: #38383a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background-color: var(--bg-color);
      padding-top: calc(env(safe-area-inset-top) + 12px);
    }

    .title-input {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.8rem;
      font-weight: bold;
      width: 60%;
      outline: none;
    }

    .btn-edit {
      background: #2c2c2e;
      color: var(--accent-blue);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-trash {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: var(--accent-red);
      margin-left: 10px;
      cursor: pointer;
    }

    /* BUDGET DASHBOARD */
    .budget-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 12px 16px;
      background-color: #121214;
    }

    .budget-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .budget-card input {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.85rem;
      width: 100%;
    }

    .budget-name {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .budget-amount {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .amount-green { color: var(--accent-green); }
    .amount-red { color: var(--accent-red); }

    .btn-add-profile {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      color: var(--accent-blue);
      border-radius: 12px;
      min-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* ITEM LIST */
    .item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .item-buyer {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border-radius: 6px;
      overflow: hidden;
    }

    .stepper button {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      padding: 4px 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .stepper span {
      font-size: 0.85rem;
      padding: 0 4px;
    }

    .btn-delete-item {
      color: var(--accent-red);
      background: transparent;
      border: none;
      font-size: 1.1rem;
      margin-left: 8px;
      cursor: pointer;
    }

    /* FOOTER */
    .footer {
      padding: 12px 16px;
      padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .input-name { flex: 1; }
    .input-price { width: 175px; }

    .segmented-picker {
      display: flex;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 2px;
      overflow-x: auto;
    }

    .picker-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 20px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .picker-btn.active {
      background: #636366;
      font-weight: 600;
    }

    .btn-add-item {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-add-item:disabled {
      opacity: 0.5;
    }

    .btn-scan {
      background: var(--input-bg);
      color: var(--accent-blue);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-scan:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .scan-status {
      min-height: 1rem;
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .spinner {
      display: inline-block;
      width: 0.8rem;
      height: 0.8rem;
      margin-right: 0.35rem;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -0.08rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <input type="text" id="tripName" class="title-input" value="Grocery Run" onchange="saveData()">
    <div>
      <button class="btn-edit" id="editBudgetsBtn" onclick="toggleEditBudgets()">Edit Budgets</button>
      <button class="btn-trash" onclick="clearAllItems()">🗑️</button>
    </div>
  </div>

  <!-- BUDGET DASHBOARD -->
  <div class="budget-scroll" id="budgetDashboard"></div>

  <!-- ITEM LIST -->
  <div class="item-list" id="itemList"></div>

  <!-- STICKY FOOTER -->
  <div class="footer">
    <div class="input-group">
      <input type="text" id="newItemName" class="input-name" placeholder="Item Name" oninput="validateInput()" onkeydown="handleItemNameKeydown(event)">
      <input type="number" step="0.01" id="newItemPrice" class="input-price" placeholder="Price" oninput="validateInput()" onkeydown="handleItemPriceKeydown(event)">
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden onchange="processScan(event)">
    
    <div class="input-group">
      <div class="segmented-picker" id="shopperPicker"></div>
      <button class="btn-scan" id="scanButton" type="button" onclick="document.getElementById('cameraInput').click()" aria-label="Scan a price tag" title="Scan a price tag">📷</button>
      <button class="btn-add-item" id="addItemBtn" disabled onclick="addItem()">Add</button>
    </div>
    <p class="scan-status" id="scanStatus" aria-live="polite"></p>
  </div>

  <script>
    // STATE MANAGEMENT
    let state = {
      tripName: "Grocery Run",
      isEditingBudgets: false,
      selectedProfileId: null,
      profiles: [
        { id: '1', name: "Me", budget: 300 }
      ],
      items: []
    };

    // LOCAL STORAGE HANDLING
    function loadData() {
      const saved = localStorage.getItem('costco_tracker_data');
      if (saved) {
        state = JSON.parse(saved);
        state.isEditingBudgets = false;
      }
      if (state.profiles.length > 0 && !state.selectedProfileId) {
        state.selectedProfileId = state.profiles[0].id;
      }
      render();
    }

    function saveData() {
      state.tripName = document.getElementById('tripName').value;
      localStorage.setItem('costco_tracker_data', JSON.stringify(state));
      render();
    }

    // CALCULATIONS
    function totalSpent(profileId) {
      return state.items
        .filter(item => item.profileId === profileId)
        .reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
    }

    // RENDER FUNCTIONS
    function render() {
      document.getElementById('tripName').value = state.tripName;
      document.getElementById('editBudgetsBtn').innerText = state.isEditingBudgets ? "Done" : "Edit Budgets";

      // Render Dashboard
      const dashboard = document.getElementById('budgetDashboard');
      dashboard.innerHTML = '';

      state.profiles.forEach(profile => {
        const spent = totalSpent(profile.id);
        const remaining = profile.budget - spent;

        const card = document.createElement('div');
        card.className = 'budget-card';
        card.dataset.profileId = profile.id;

        if (state.isEditingBudgets) {
          card.innerHTML = `
            <input type="text" value="${profile.name}" placeholder="Budget name" onchange="updateProfile('${profile.id}', 'name', this.value)" onkeydown="handleBudgetNameKeydown(event, '${profile.id}')">
            <input type="number" value="${profile.budget}" placeholder="$0" min="0" step="0.01" onchange="updateProfile('${profile.id}', 'budget', this.value === '' ? '' : parseFloat(this.value) || 0)" onkeydown="handleBudgetAmountKeydown(event, '${profile.id}')">
            <button onclick="deleteProfile('${profile.id}')" style="color:var(--accent-red); background:none; border:none; text-align:left; font-size:0.75rem; cursor:pointer;">Delete</button>
          `;
        } else {
          card.innerHTML = `
            <span class="budget-name">${profile.name}</span>
            <span class="budget-amount ${remaining >= 0 ? 'amount-green' : 'amount-red'}">$${remaining.toFixed(2)}</span>
          `;
        }
        dashboard.appendChild(card);
      });

      if (state.isEditingBudgets) {
        const addBtn = document.createElement('button');
        addBtn.className = 'btn-add-profile';
        addBtn.innerHTML = `<span>+</span><span style="font-size:0.75rem">Add</span>`;
        addBtn.onclick = addProfile;
        dashboard.appendChild(addBtn);
      }

      // Render Item List
      const list = document.getElementById('itemList');
      list.innerHTML = '';

      state.items.forEach(item => {
        const profile = state.profiles.find(p => p.id === item.profileId);
        const total = item.unitPrice * item.quantity;

        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-details">
            <span class="item-name">${item.name}</span>
            <span class="item-buyer">${profile ? profile.name : 'Unknown'}</span>
          </div>
          <div class="item-controls">
            <div class="stepper">
              <button onclick="updateQuantity('${item.id}', -1)">-</button>
              <span>${item.quantity}</span>
              <button onclick="updateQuantity('${item.id}', 1)">+</button>
            </div>
            <span style="font-size:0.85rem; color:var(--text-secondary)">x $${item.unitPrice.toFixed(2)}</span>
            <span style="font-weight:bold; min-width:60px; text-align:right">$${total.toFixed(2)}</span>
            <button class="btn-delete-item" onclick="deleteItem('${item.id}')">✕</button>
          </div>
        `;
        list.appendChild(row);
      });

      // Render Shopper Picker
      const picker = document.getElementById('shopperPicker');
      picker.innerHTML = '';

      state.profiles.forEach(profile => {
        const btn = document.createElement('button');
        btn.className = `picker-btn ${state.selectedProfileId === profile.id ? 'active' : ''}`;
        btn.innerText = profile.name;
        btn.onclick = () => {
          state.selectedProfileId = profile.id;
          render();
        };
        picker.appendChild(btn);
      });

      validateInput();
    }

    // USER ACTIONS
    function toggleEditBudgets() {
      state.isEditingBudgets = !state.isEditingBudgets;
      render();
    }

    function addProfile() {
      const id = Date.now().toString();
      state.profiles.push({ id, name: "", budget: "" });
      if (!state.selectedProfileId) state.selectedProfileId = id;
      saveData();
      document.querySelector(`[data-profile-id="${id}"] input[type="text"]`)?.focus();
    }

    function updateProfile(id, key, value) {
      const profile = state.profiles.find(p => p.id === id);
      if (profile) {
        profile[key] = value;
        saveData();
      }
    }

    function handleBudgetNameKeydown(event, id) {
      if (event.key !== 'Enter') return;

      event.preventDefault();
      updateProfile(id, 'name', event.currentTarget.value);
      document.querySelector(`[data-profile-id="${id}"] input[type="number"]`)?.focus();
    }

    function handleBudgetAmountKeydown(event, id) {
      if (event.key !== 'Enter') return;

      event.preventDefault();
      const profile = state.profiles.find(p => p.id === id);
      if (profile) {
        profile.budget = event.currentTarget.value === '' ? '' : parseFloat(event.currentTarget.value) || 0;
      }
      state.isEditingBudgets = false;
      saveData();
    }

    function deleteProfile(id) {
      state.profiles = state.profiles.filter(p => p.id !== id);
      if (state.selectedProfileId === id) {
        state.selectedProfileId = state.profiles[0]?.id || null;
      }
      saveData();
    }

    function addItem() {
      const nameInput = document.getElementById('newItemName');
      const priceInput = document.getElementById('newItemPrice');

      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (name && !isNaN(price) && state.selectedProfileId) {
        state.items.push({
          id: Date.now().toString(),
          name,
          unitPrice: price,
          quantity: 1,
          profileId: state.selectedProfileId
        });

        nameInput.value = '';
        priceInput.value = '';
        saveData();
      }
    }

    function handleItemNameKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('newItemPrice').focus();
      }
    }

    function handleItemPriceKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        addItem();
      }
    }

    async function processScan(event) {
      const image = event.target.files?.[0];
      if (!image) return;

      const scanButton = document.getElementById('scanButton');
      const scanStatus = document.getElementById('scanStatus');
      const nameInput = document.getElementById('newItemName');
      const priceInput = document.getElementById('newItemPrice');

      scanButton.disabled = true;
      scanButton.innerHTML = '<span class="spinner" aria-hidden="true"></span>Scanning';
      scanStatus.textContent = 'Reading price tag…';

      try {
        const { data: { text } } = await Tesseract.recognize(image, 'eng');
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        const priceMatch = text.match(/\b\d+\.\d{2}\b/);

        if (lines[0]) nameInput.value = lines[0];
        if (priceMatch) priceInput.value = priceMatch[0];

        scanStatus.textContent = priceMatch
          ? 'Price tag scanned. Review the details, then add the item.'
          : 'Text scanned. Add or correct the price before adding the item.';
        validateInput();
      } catch (error) {
        console.error('Price tag scan failed:', error);
        scanStatus.textContent = 'Could not read that photo. Please try another image.';
      } finally {
        scanButton.disabled = false;
        scanButton.textContent = '📷';
        event.target.value = '';
      }
    }

    function updateQuantity(id, delta) {
      const item = state.items.find(i => i.id === id);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          deleteItem(id);
        } else {
          saveData();
        }
      }
    }

    function deleteItem(id) {
      state.items = state.items.filter(i => i.id !== id);
      saveData();
    }

    function clearAllItems() {
      if (confirm("Clear all items from this trip?")) {
        state.items = [];
        saveData();
      }
    }

    function validateInput() {
      const name = document.getElementById('newItemName').value.trim();
      const price = document.getElementById('newItemPrice').value.trim();
      document.getElementById('addItemBtn').disabled = !(name && price && state.selectedProfileId);
    }

    // INITIALIZATION & SERVICE WORKER (OFFLINE SUPPORT)
    loadData();

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('pwa-v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
  </script>
</body>
</html>
